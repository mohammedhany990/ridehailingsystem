server:
  port: 8083

spring:
  application:
    name: ride-service

  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/ride_db}
    username: ${SPRING_DATASOURCE_USERNAME:${POSTGRES_USER:postgres}}
    password: ${SPRING_DATASOURCE_PASSWORD:${POSTGRES_PASSWORD:postgres}}
    driver-class-name: org.postgresql.Driver

  jpa:
    hibernate:
      ddl-auto: update
    show-sql: false
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect

  cloud:
    openfeign:
      client:
        config:
          default:
            connectTimeout: 1000
            readTimeout: 2000

jwt:
  secret: ${JWT_SECRET}

eureka:
  client:
    service-url:
      defaultZone: http://eureka-server:8761/eureka
    register-with-eureka: true
    fetch-registry: true

  instance:
    prefer-ip-address: true

feign:
  client:
    config:
      location-service:
        url: ${LOCATION_SERVICE_URL:http://localhost:8084}

      user-service:
        url: ${USER_SERVICE_URL:http://localhost:8082}

      map-service:
        url: ${MAP_SERVICE_URL:http://localhost:8089}

      pricing-service:
        url: ${PRICING_SERVICE_URL:http://localhost:8085}

springdoc:
  api-docs:
    path: /v3/api-docs

  swagger-ui:
    path: /swagger-ui.html

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics

  endpoint:
    health:
      show-details: always

logging:
  level:
    com.ridehailing.rideservice: INFO

resilience4j:
  circuitbreaker:
    configs:
      default:
        slidingWindowSize: 10
        minimumNumberOfCalls: 5
        failureRateThreshold: 50
        waitDurationInOpenState: 30s
        automaticTransitionFromOpenToHalfOpenEnabled: true
        permittedNumberOfCallsInHalfOpenState: 3
    instances:
      user:
        baseConfig: default
      pricing:
        baseConfig: default
      map:
        baseConfig: default
      location:
        baseConfig: default

  retry:
    configs:
      default:
        maxAttempts: 3
        waitDuration: 500ms
    instances:
      user:
        baseConfig: default
      pricing:
        baseConfig: default
      map:
        baseConfig: default
      location:
        baseConfig: default

  bulkhead:
    instances:
      location:
        maxConcurrentCalls: 20
        maxWaitDuration: 500ms