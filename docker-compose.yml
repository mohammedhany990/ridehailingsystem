networks:
  ride-net:
    driver: bridge

volumes:
  postgres-data:
  mongodb-data:
  redis-data:
  kafka-data:
  auth-uploads:

x-spring-service: &spring-service
  restart: unless-stopped
  networks:
    - ride-net
  depends_on:
    config-server:
      condition: service_healthy

x-spring-env: &spring-env
  CONFIG_SERVER_URL: http://config-server:8889
  EUREKA_URI: http://eureka-server:8761/eureka

services:

  ride-hailing-postgres:
    image: postgres:15-alpine
    container_name: ride-hailing-postgres
    restart: unless-stopped

    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}

    ports:
      - "5432:5432"

    volumes:
      - postgres-data:/var/lib/postgresql/data
      - ./postgres/init:/docker-entrypoint-initdb.d:ro

    networks:
      - ride-net

    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d postgres"]
      interval: 10s
      timeout: 5s
      retries: 10

  mongodb:
    image: mongo:7.0
    container_name: ride-mongodb
    restart: unless-stopped

    environment:
      MONGO_INITDB_ROOT_USERNAME: ${MONGO_USER}
      MONGO_INITDB_ROOT_PASSWORD: ${MONGO_PASSWORD}

    ports:
      - "27017:27017"

    volumes:
      - mongodb-data:/data/db
      - ./mongodb/init:/docker-entrypoint-initdb.d:ro

    networks:
      - ride-net

    healthcheck:
      test: ["CMD", "mongosh", "--quiet", "--eval", "db.adminCommand({ ping: 1 })"]
      interval: 60s
      timeout: 10s
      retries: 5
      start_period: 30s

  redis:
    image: redis:7-alpine
    container_name: ride-redis
    restart: unless-stopped

    command: redis-server --requirepass ${SPRING_DATA_REDIS_PASSWORD}

    ports:
      - "6379:6379"

    volumes:
      - redis-data:/data

    networks:
      - ride-net

    healthcheck:
      test: ["CMD", "redis-cli", "-a", "${SPRING_DATA_REDIS_PASSWORD}", "ping"]
      interval: 10s
      timeout: 5s
      retries: 10

  kafka:
    image: apache/kafka:3.9.1
    container_name: ride-kafka
    restart: unless-stopped
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_CLUSTER_ID: ride-hailing-kraft-01
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_LISTENERS: PLAINTEXT://:9092,CONTROLLER://:9093
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:9092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "true"
    ports:
      - "9092:9092"
    volumes:
      - kafka-data:/var/lib/kafka/data
    networks:
      - ride-net
    healthcheck:
      test: ["CMD-SHELL", "/opt/kafka/bin/kafka-topics.sh --bootstrap-server localhost:9092 --list > /dev/null 2>&1 || exit 1"]
      interval: 10s
      timeout: 10s
      retries: 12
      start_period: 30s

  pgadmin:
    image: dpage/pgadmin4
    container_name: ride-pgadmin
    restart: unless-stopped

    environment:
      PGADMIN_DEFAULT_EMAIL: admin@admin.com
      PGADMIN_DEFAULT_PASSWORD: admin123

    ports:
      - "5050:80"

    networks:
      - ride-net

    depends_on:
      ride-hailing-postgres:
        condition: service_healthy

  config-server:
    <<: *spring-service
    container_name: config-server
    build: ./config-server
    depends_on: []
    ports:
      - "8889:8889"
    environment:
      CONFIG_REPO_LOCATION: file:/config-repo
    volumes:
      - ./config-repo:/config-repo:ro
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:8889/actuator/health || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 30s

  eureka-server:
    <<: *spring-service
    container_name: eureka-server
    build: ./eureka-server

    ports:
      - "8761:8761"

    environment:
      SPRING_APPLICATION_NAME: eureka-server

    healthcheck:
      test: [ "CMD-SHELL", "wget -qO- http://localhost:8761 || exit 1" ]
      interval: 10s
      timeout: 5s
      retries: 10

  api-gateway:
    <<: *spring-service
    container_name: api-gateway
    build: ./api-gateway

    ports:
      - "8888:8888"

    depends_on:
      config-server:
        condition: service_healthy
      eureka-server:
        condition: service_healthy

    environment:
      <<: *spring-env
      EUREKA_CLIENT_SERVICEURL_DEFAULTZONE: http://eureka-server:8761/eureka
      SPRING_APPLICATION_NAME: gateway-service
      SPRING_DATA_REDIS_HOST: redis
      SPRING_DATA_REDIS_PASSWORD: ${SPRING_DATA_REDIS_PASSWORD}
      JWT_SECRET: ${JWT_SECRET}

    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:8888/actuator/health || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 60s

  auth-service:
    <<: *spring-service
    container_name: auth-service
    build: ./auth-service

    ports:
      - "8081:8081"

    environment:
      <<: *spring-env
      SPRING_DATASOURCE_URL: jdbc:postgresql://ride-hailing-postgres:5432/auth_db
      SPRING_DATASOURCE_USERNAME: ${POSTGRES_USER}
      SPRING_DATASOURCE_PASSWORD: ${POSTGRES_PASSWORD}

      JWT_SECRET: ${JWT_SECRET}

      SPRING_DATA_REDIS_HOST: redis
      SPRING_DATA_REDIS_PASSWORD: ${SPRING_DATA_REDIS_PASSWORD}
      SPRING_MAIL_HOST: ${SPRING_MAIL_HOST}
      SPRING_MAIL_PORT: ${SPRING_MAIL_PORT}
      SPRING_MAIL_USERNAME: ${SPRING_MAIL_USERNAME}
      SPRING_MAIL_PASSWORD: ${SPRING_MAIL_PASSWORD}

      SPRING_MAIL_PROPERTIES_MAIL_SMTP_AUTH: true
      SPRING_MAIL_PROPERTIES_MAIL_SMTP_STARTTLS_ENABLE: true

      GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID:-}

    volumes:
      - auth-uploads:/app/uploads

    depends_on:
      config-server:
        condition: service_healthy
      ride-hailing-postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

  frontend:
    container_name: ride-frontend
    build:
      context: ./frontend
      args:
        GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID:-}

    ports:
      - "8080:80"

    depends_on:
      - api-gateway

  user-service:
    <<: *spring-service
    container_name: user-service
    build: ./user-service

    ports:
      - "8082:8082"

    environment:
      <<: *spring-env
      SPRING_DATASOURCE_URL: jdbc:postgresql://ride-hailing-postgres:5432/user_db
      SPRING_DATASOURCE_USERNAME: ${POSTGRES_USER}
      SPRING_DATASOURCE_PASSWORD: ${POSTGRES_PASSWORD}
      JWT_SECRET: ${JWT_SECRET}
      SPRING_MAIL_USERNAME: ${SPRING_MAIL_USERNAME}
      SPRING_MAIL_PASSWORD: ${SPRING_MAIL_PASSWORD}

    depends_on:
      config-server:
        condition: service_healthy
      ride-hailing-postgres:
        condition: service_healthy

    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:8082/actuator/health || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 60s

  ride-service:
    <<: *spring-service
    container_name: ride-service
    build: ./ride-service

    ports:
      - "8083:8083"

    environment:
      <<: *spring-env
      SPRING_DATASOURCE_URL: jdbc:postgresql://ride-hailing-postgres:5432/ride_db
      SPRING_DATASOURCE_USERNAME: ${POSTGRES_USER}
      SPRING_DATASOURCE_PASSWORD: ${POSTGRES_PASSWORD}
      JWT_SECRET: ${JWT_SECRET}

      KAFKA_BOOTSTRAP_SERVERS: kafka:9092
      LOCATION_SERVICE_URL: http://location-service:8084
      USER_SERVICE_URL: http://user-service:8082
      MAP_SERVICE_URL: http://map-service:8089
      PRICING_SERVICE_URL: http://pricing-service:8085

    depends_on:
      config-server:
        condition: service_healthy
      ride-hailing-postgres:
        condition: service_healthy
      location-service:
        condition: service_healthy
      user-service:
        condition: service_healthy
      map-service:
        condition: service_healthy
      pricing-service:
        condition: service_healthy
      kafka:
        condition: service_healthy

    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:8083/actuator/health || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 60s

  pricing-service:
    <<: *spring-service
    container_name: pricing-service
    build: ./pricing-service

    ports:
      - "8085:8085"

    environment:
      <<: *spring-env
      SPRING_DATASOURCE_URL: jdbc:postgresql://ride-hailing-postgres:5432/pricing_db
      SPRING_DATASOURCE_USERNAME: ${POSTGRES_USER}
      SPRING_DATASOURCE_PASSWORD: ${POSTGRES_PASSWORD}
      JWT_SECRET: ${JWT_SECRET}
      SPRING_DATA_REDIS_HOST: redis
      SPRING_DATA_REDIS_PASSWORD: ${SPRING_DATA_REDIS_PASSWORD}

    depends_on:
      config-server:
        condition: service_healthy
      ride-hailing-postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:8085/actuator/health || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 60s

  rating-service:
    <<: *spring-service
    container_name: rating-service
    build: ./rating-service

    ports:
      - "8088:8088"

    environment:
      <<: *spring-env
      SPRING_DATASOURCE_URL: jdbc:postgresql://ride-hailing-postgres:5432/rating_db
      SPRING_DATASOURCE_USERNAME: ${POSTGRES_USER}
      SPRING_DATASOURCE_PASSWORD: ${POSTGRES_PASSWORD}
      JWT_SECRET: ${JWT_SECRET}

    depends_on:
      config-server:
        condition: service_healthy
      ride-hailing-postgres:
        condition: service_healthy

    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:8088/actuator/health || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 60s

  location-service:
    <<: *spring-service
    container_name: location-service
    build: ./location-service

    ports:
      - "8084:8084"

    environment:
      <<: *spring-env
      JWT_SECRET: ${JWT_SECRET}
      SPRING_DATA_REDIS_HOST: redis
      SPRING_DATA_REDIS_PASSWORD: ${SPRING_DATA_REDIS_PASSWORD}
      SPRING_DATA_MONGODB_HOST: mongodb
      SPRING_DATA_MONGODB_USERNAME: ${MONGO_USER}
      SPRING_DATA_MONGODB_PASSWORD: ${MONGO_PASSWORD}
      USER_SERVICE_URL: http://user-service:8082

    depends_on:
      config-server:
        condition: service_healthy
      redis:
        condition: service_healthy
      mongodb:
        condition: service_healthy
      user-service:
        condition: service_healthy

    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:8084/actuator/health || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 60s

  payment-service:
    <<: *spring-service
    container_name: payment-service
    build: ./payment-service
    ports:
      - "8086:8086"
    environment:
      <<: *spring-env
      SPRING_DATASOURCE_URL: jdbc:postgresql://ride-hailing-postgres:5432/payment_db
      SPRING_DATASOURCE_USERNAME: ${POSTGRES_USER}
      SPRING_DATASOURCE_PASSWORD: ${POSTGRES_PASSWORD}
      JWT_SECRET: ${JWT_SECRET}
      KAFKA_BOOTSTRAP_SERVERS: kafka:9092
      STRIPE_ENABLED: ${STRIPE_ENABLED:-false}
      STRIPE_SECRET_KEY: ${STRIPE_SECRET_KEY:-}
      STRIPE_WEBHOOK_SECRET: ${STRIPE_WEBHOOK_SECRET:-}
      STRIPE_PUBLISHABLE_KEY: ${STRIPE_PUBLISHABLE_KEY:-}
    depends_on:
      config-server:
        condition: service_healthy
      ride-hailing-postgres:
        condition: service_healthy
      kafka:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:8086/actuator/health || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 60s

  notification-service:
    <<: *spring-service
    container_name: notification-service
    build: ./notification-service
    ports:
      - "8090:8090"
    environment:
      <<: *spring-env
      SPRING_DATASOURCE_URL: jdbc:postgresql://ride-hailing-postgres:5432/notification_db
      SPRING_DATASOURCE_USERNAME: ${POSTGRES_USER}
      SPRING_DATASOURCE_PASSWORD: ${POSTGRES_PASSWORD}
      JWT_SECRET: ${JWT_SECRET}
      KAFKA_BOOTSTRAP_SERVERS: kafka:9092
    depends_on:
      config-server:
        condition: service_healthy
      ride-hailing-postgres:
        condition: service_healthy
      kafka:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:8090/actuator/health || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 60s

  map-service:
    <<: *spring-service
    container_name: map-service
    build: ./map-service

    ports:
      - "8089:8089"

    environment:
      <<: *spring-env
      JWT_SECRET: ${JWT_SECRET}

    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:8089/actuator/health || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 60s