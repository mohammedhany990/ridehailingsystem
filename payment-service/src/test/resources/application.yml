spring:
  cloud:
    config:
      enabled: false
  datasource:
    url: jdbc:h2:mem:payment_test
    driver-class-name: org.h2.Driver
    username: sa
    password:
  jpa:
    hibernate:
      ddl-auto: create-drop
  kafka:
    consumer:
      auto-offset-reset: earliest
      group-id: payment-service-test
      key-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      value-deserializer: org.springframework.kafka.support.serializer.JsonDeserializer
      properties:
        spring.json.trusted.packages: "*"
        spring.json.value.default.type: com.ridehailing.paymentservice.event.RideEvent
        spring.json.use.type.headers: false
    producer:
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.springframework.kafka.support.serializer.JsonSerializer
      properties:
        spring.json.add.type.headers: false

eureka:
  client:
    enabled: false

jwt:
  secret: dGVzdFNlY3JldEtleUZvclVuaXRUZXN0c1Rlc3RTZWNyZXRLZXlGb3JVbml0VGVzdHM=

stripe:
  enabled: false

app:
  payments:
    currency: EGP
    default-amount: 85.50
