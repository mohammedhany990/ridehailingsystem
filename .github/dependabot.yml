version: 2
updates:
  - package-ecosystem: maven
    directories:
      - "/"
      - "/api-gateway"
      - "/auth-service"
      - "/config-server"
      - "/eureka-server"
      - "/location-service"
      - "/map-service"
      - "/notification-service"
      - "/payment-service"
      - "/pricing-service"
      - "/rating-service"
      - "/ride-service"
      - "/user-service"
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
  - package-ecosystem: github-actions
    directory: "/"
    schedule:
      interval: weekly
  - package-ecosystem: docker
    directories:
      - "/api-gateway"
      - "/auth-service"
      - "/config-server"
      - "/eureka-server"
      - "/location-service"
      - "/map-service"
      - "/notification-service"
      - "/payment-service"
      - "/pricing-service"
      - "/rating-service"
      - "/ride-service"
      - "/user-service"
    schedule:
      interval: weekly
