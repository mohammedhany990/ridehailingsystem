name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        service:
          - eureka-server
          - config-server
          - notification-service
          - payment-service
          - api-gateway
          - auth-service
          - user-service
          - ride-service
          - location-service
          - pricing-service
          - rating-service
          - map-service
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
          cache: maven
      - name: Build ${{ matrix.service }}
        working-directory: ${{ matrix.service }}
        run: |
          if [ "${{ matrix.service }}" = "notification-service" ] || [ "${{ matrix.service }}" = "payment-service" ] || [ "${{ matrix.service }}" = "ride-service" ] || [ "${{ matrix.service }}" = "pricing-service" ]; then
            ./mvnw -B clean verify
          else
            ./mvnw -B clean package -DskipTests
          fi
      - name: Upload coverage report
        if: matrix.service == 'notification-service' || matrix.service == 'payment-service'
        uses: actions/upload-artifact@v4
        with:
          name: coverage-${{ matrix.service }}
          path: ${{ matrix.service }}/target/site/jacoco/
          retention-days: 14

  compose-smoke:
    runs-on: ubuntu-latest
    needs: build
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - name: Create .env
        run: |
          JWT_SECRET=$(openssl rand -base64 48)
          cat > .env <<EOF
          POSTGRES_USER=postgres
          POSTGRES_PASSWORD=ci_postgres
          MONGO_USER=mongo
          MONGO_PASSWORD=ci_mongo
          SPRING_DATA_REDIS_PASSWORD=ci_redis
          JWT_SECRET=$JWT_SECRET
          SPRING_MAIL_HOST=localhost
          SPRING_MAIL_PORT=1025
          SPRING_MAIL_USERNAME=ci
          SPRING_MAIL_PASSWORD=ci
          EOF
          sed -i 's/^          //' .env
      - name: Build and start the stack
        run: |
          if ! docker compose up -d --build; then
            docker compose logs --tail=120
            exit 1
          fi
      - name: Wait for services
        run: |
          set -e
          declare -A checks=(
            [eureka]="http://localhost:8761"
            [config-server]="http://localhost:8889/actuator/health"
            [config-served]="http://localhost:8889/auth-service/default"
            [gateway]="http://localhost:8888/actuator/health"
            [auth]="http://localhost:8081/actuator/health"
            [user]="http://localhost:8082/actuator/health"
            [ride]="http://localhost:8083/actuator/health"
            [location]="http://localhost:8084/actuator/health"
            [pricing]="http://localhost:8085/actuator/health"
            [rating]="http://localhost:8088/actuator/health"
            [map]="http://localhost:8089/actuator/health"
            [notification]="http://localhost:8090/actuator/health"
            [payment]="http://localhost:8086/actuator/health"
          )
          for name in "${!checks[@]}"; do
            url="${checks[$name]}"
            ok=false
            for i in $(seq 1 60); do
              if curl -fsS "$url" > /dev/null 2>&1; then ok=true; break; fi
              sleep 10
            done
            if [ "$ok" = true ]; then echo "PASS $name"; else echo "FAIL $name"; FAILED=1; fi
          done
          docker compose ps
          if [ -n "$FAILED" ]; then docker compose logs --tail=200; exit 1; fi
      - name: Tear down
        if: always()
        run: docker compose down -v

  e2e:
    runs-on: ubuntu-latest
    needs: compose-smoke
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - name: Create .env
        run: |
          cat > .env <<'EOF'
          POSTGRES_USER=postgres
          POSTGRES_PASSWORD=ci_postgres
          MONGO_USER=mongo
          MONGO_PASSWORD=ci_mongo
          SPRING_DATA_REDIS_PASSWORD=ci_redis
          JWT_SECRET=$(openssl rand -base64 48)
          SPRING_MAIL_HOST=mailhog
          SPRING_MAIL_PORT=1025
          SPRING_MAIL_USERNAME=e2e
          SPRING_MAIL_PASSWORD=e2e
          EOF
          sed -i 's/^          //' .env
      - name: Start the stack with mailhog
        run: docker compose -f docker-compose.yml -f docker-compose.e2e.yml up -d --build
      - name: Wait for the gateway
        run: |
          for i in $(seq 1 90); do
            if curl -fsS http://localhost:8888/actuator/health > /dev/null 2>&1; then break; fi
            sleep 10
          done
          for svc in 8081 8082 8083 8084 8085 8086 8088 8089 8090; do
            ok=false
            for i in $(seq 1 60); do
              if curl -fsS "http://localhost:$svc/actuator/health" > /dev/null 2>&1; then ok=true; break; fi
              sleep 10
            done
            [ "$ok" = true ] || { echo "service on $svc never became healthy"; docker compose logs --tail=200; exit 1; }
          done
      - name: Run the end-to-end flow
        run: ./scripts/e2e.sh
      - name: Logs on failure
        if: failure()
        run: docker compose logs --tail=300
      - name: Tear down
        if: always()
        run: docker compose -f docker-compose.yml -f docker-compose.e2e.yml down -v
